<!DOCTYPE html>
<html>
<head>
<title>News Detail</title>

<style>
body {
  font-family: Arial;
  background:#f5f5f5;
  margin:0;
  padding:20px;
}

.container {
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
  max-width:600px;
  margin:auto;
}

button {
  background:blue;
  color:white;
  padding:10px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

button:hover {
  background:red;
}

a {
  text-decoration:none;
  color:blue;
}
</style>

</head>

<body>

<div class="container">

<h2>Railway Vacancy News 2026</h2>

<p>Railway has released new vacancies...</p>

<button onclick="toggle()">Read More</button>

<p id="more" style="display:none;">
More details about exam pattern, eligibility etc.
</p>

<br><br>

<a href="index.html">⬅ Back to Home</a>

</div>

<script>
function toggle(){
  var x = document.getElementById("more");
  if(x.style.display==="none"){
    x.style.display="block";
  } else {
    x.style.display="none";
  }
}
</script>

</body>
</html>
